[package]
name = "tpt-version-derive"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Derive macro for tpt-version's Entity trait"
repository = "https://github.com/tpt-solutions/tpt-version"
# Published together with tpt-version, once its git dependencies are released.
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
