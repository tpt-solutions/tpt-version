[package]
name = "tpt-version-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Browser demo of tpt-version: branch, edit and merge a key-value document"
# Built for the browser with wasm-bindgen. Not published.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-version = { path = "..", default-features = false, features = ["derive"] }
wasm-bindgen = "0.2"
