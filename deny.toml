# Dependency policy, checked by `cargo deny check` in CI.

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
# Git and path dependencies have no version requirement. Their revisions are
# pinned in Cargo.toml and Cargo.lock, so they are not wildcards in practice.
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The crypto and testkit crates are git dependencies, pinned in Cargo.toml.
allow-git = [
    "https://github.com/tpt-solutions/tpt-crypto",
    "https://github.com/tpt-solutions/tpt-testkit",
]
