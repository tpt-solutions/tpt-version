[package]
name = "tpt-version"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Content-addressable, structure-aware version control for tpt-model entities"
repository = "https://github.com/tpt-solutions/tpt-version"
readme = "README.md"
keywords = ["version-control", "merkle-dag", "cad", "merge", "no-std"]
categories = ["data-structures", "no-std", "development-tools"]
# Depends on git dependencies, so it cannot be published to crates.io yet.
publish = false

[features]
default = ["std", "derive", "cli"]
std = ["tpt-crypto-hash/std", "tpt-crypto-sig/std"]
# #[derive(Entity)]. Needs no std, but pulls in the proc-macro crate at build time.
derive = ["dep:tpt-version-derive"]
# S3-backed object store. Needs std, and the caller supplies the network client.
s3 = ["std"]
# The tpt command-line tool. Needs std for the file-system store.
cli = ["std"]

[dependencies]
tpt-crypto-hash = { git = "https://github.com/tpt-solutions/tpt-crypto", default-features = false, features = ["alloc"] }
tpt-crypto-sig = { git = "https://github.com/tpt-solutions/tpt-crypto", default-features = false, features = ["alloc"] }
tpt-version-derive = { path = "derive", optional = true }

[[example]]
name = "cad_branch_merge"
required-features = ["std"]

[[example]]
name = "spreadsheet_cells"
required-features = ["std"]

[[example]]
name = "document_blocks"
required-features = ["std"]

[[example]]
name = "file_store_cli"
required-features = ["std"]

[[example]]
name = "signed_history"
required-features = ["std"]

[[example]]
name = "s3_sync"
required-features = ["s3"]

[[bench]]
name = "throughput"
harness = false
required-features = ["std"]

[dev-dependencies]
# Dev-only. Pinned to a revision, since the crate is not on crates.io.
tpt-testkit = { git = "https://github.com/tpt-solutions/tpt-testkit", rev = "e77a90198eed4235224a49e3226fe2c1b9f2247b", default-features = false, features = ["golden", "property"] }
proptest = "1"
# Benchmarks only.
criterion = "0.5"

[workspace]
members = ["derive", "wasm"]


[[bin]]
name = "tpt"
path = "src/bin/tpt.rs"
required-features = ["cli"]
